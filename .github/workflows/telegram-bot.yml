name: Telegram scheduled bot

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      send_now:
        description: "Send immediately, ignoring the schedule"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: telegram-bot-run
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ "${{ inputs.send_now }}" = "true" ]; then
            python3 bot.py --now
          else
            python3 bot.py
          fi

      - name: Save history
        if: always()
        run: |
          git config user.name "telegram-auto-bot"
          git config user.email "actions@users.noreply.github.com"
          git add history.json
          git diff --cached --quiet || git commit -m "Update bot history"
          git push || true
